<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="台北晶華酒店中心的3D旅遊導覽島，含20個台北景點、捷運建議與飯店服務資訊"><title>台北晶華酒店・3D城市導覽島</title>
<style>
:root{--ink:#203a42;--cream:#fffaf0;--green:#9bc7a8;--gold:#e9bf68;--coral:#d98469;--blue:#4d8ca3}*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;color:var(--ink);background:#d6e9e3}#scene{position:fixed;inset:0;width:100%;height:100%;display:block}.topbar{position:fixed;z-index:5;top:14px;left:50%;transform:translateX(-50%);text-align:center;background:#fffaf0ed;border:1px solid #ffffff;border-radius:18px;padding:10px 22px;box-shadow:0 8px 30px #244c3d20;min-width:min(430px,90vw)}.topbar b{display:block;font-size:clamp(17px,2.5vw,27px);letter-spacing:.08em}.topbar span{font-size:11px;letter-spacing:.12em;color:#607b76}.leftbox,.rightbox{position:fixed;z-index:5;top:14px;background:#fffaf0ed;border:1px solid #fff;border-radius:16px;padding:12px 14px;box-shadow:0 8px 30px #244c3d20;font-size:12px}.leftbox{left:14px;top:100px;line-height:1.8}.rightbox{right:14px;top:100px;width:min(250px,42vw)}.rightbox h3,.leftbox h3{margin:0 0 7px;font-size:13px}.rightbox p{margin:5px 0;line-height:1.5}.rightbox select,.rightbox button{width:100%;padding:9px;margin-top:7px;border-radius:10px;border:1px solid #c8d8cc;background:white;color:var(--ink);font:inherit}.rightbox button{background:#244c4b;color:white;border:0;font-weight:700;cursor:pointer}.rightbox button.secondary{background:#e9f0e8;color:#244c4b}.legendline{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:#d4a447}.dot.hotel{background:#df8b4e}.dot.staff{background:#2476ba}.dot.guest{background:#d77d6b}.panel{position:fixed;z-index:8;right:14px;top:50%;transform:translate(120%,-50%);width:min(410px,calc(100vw - 28px));max-height:82vh;overflow:auto;padding:23px;background:var(--cream);border-radius:22px;box-shadow:0 18px 60px #173b4350;transition:transform .3s}.panel.open{transform:translate(0,-50%)}.panel h2{margin:5px 0 2px;font-size:24px}.panel .en{font-size:10px;letter-spacing:.12em;color:#7a958a;font-weight:800}.panel p{line-height:1.75;font-size:14px}.panel .close{position:absolute;right:12px;top:12px;border:0;border-radius:50%;width:34px;height:34px;background:#e8efe6;font-size:21px;cursor:pointer}.tag{display:inline-block;background:#e6efe5;border-radius:99px;padding:5px 10px;margin:3px 4px 7px 0;font-size:11px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.actions a,.actions button{border:0;border-radius:9px;padding:10px 13px;text-decoration:none;background:#285a55;color:white;font-weight:700;font-size:12px;cursor:pointer}.actions a.alt,.actions button.alt{background:#e7eee7;color:#294a47}.panel small{color:#63766f;line-height:1.6}.bottom{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:14px;background:#fffaf0e8;border-radius:999px;padding:9px 16px;font-size:11px;box-shadow:0 5px 20px #244c3d20;white-space:nowrap}.stafftag{font-weight:800;color:#176ca3}.mobile-note{display:none}@media(max-width:700px){.topbar{top:10px;padding:8px 12px}.leftbox{left:8px;top:83px;padding:8px;font-size:10px}.rightbox{right:8px;top:auto;bottom:52px;width:170px;padding:9px;font-size:10px}.rightbox h3{font-size:11px}.rightbox select,.rightbox button{padding:7px;font-size:10px}.panel{right:8px;top:auto;bottom:8px;transform:translateY(120%);max-height:62vh;width:calc(100vw - 16px)}.panel.open{transform:translateY(0)}.bottom{bottom:8px;left:8px;transform:none;font-size:9px;white-space:normal;max-width:calc(100vw - 195px)}}
</style></head><body><canvas id="scene" aria-label="3D飯店與台北觀光景點地圖"></canvas>
<header class="topbar"><b>REGENT TAIPEI · HOTEL ISLAND</b><span>以飯店為中心・20個台北觀光景點・員工導覽動畫</span></header>
<section class="leftbox"><h3>地圖圖例</h3><div class="legendline"><i class="dot hotel"></i>飯店中心</div><div class="legendline"><i class="dot"></i>20個觀光景點</div><div class="legendline"><i class="dot staff"></i>飯店員工主角</div><div class="legendline"><i class="dot guest"></i>散步旅客動畫</div><div style="margin-top:6px">拖曳旋轉・滾輪縮放<br>點選建築查看介紹</div></section>
<section class="rightbox"><h3>員工主角移動控制</h3><p><span class="stafftag">● 飯店服務人員</span><br><span id="staff-status">目前位置：飯店中心</span></p><select id="destination" aria-label="選擇目的地"></select><button id="go">▶ 移動至目的地</button><button id="home" class="secondary">回到飯店中心</button></section>
<aside class="panel" id="panel"><button class="close" id="close" aria-label="關閉介紹">×</button><div id="content"></div></aside>
<div class="bottom">飯店主建築固定於中心｜旅客人物會在景點間漫遊｜員工可指定目的地</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(async()=>{
const data=await fetch('./hotel-island-data.json').then(r=>{if(!r.ok)throw Error('資料檔載入失敗');return r.json()});
const canvas=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#dceee8');scene.fog=new THREE.Fog('#dceee8',28,58);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,120);camera.position.set(13,18,22);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI/2.08;controls.minDistance=9;controls.maxDistance=42;controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x78998c,2.1));const sun=new THREE.DirectionalLight(0xfff5dc,3.1);sun.position.set(-9,18,11);sun.castShadow=true;scene.add(sun);
const mat=(c,r=.78)=>new THREE.MeshStandardMaterial({color:c,roughness:r});const grass=mat('#a7cba9'),sand=mat('#f3dfb8'),white=mat('#fffaf0'),glass=mat('#8fc3c9'),terracotta=mat('#d98469'),gold=mat('#e8bd65');
const ground=new THREE.Mesh(new THREE.CircleGeometry(18,96),mat('#b6d9ce'));ground.rotation.x=-Math.PI/2;ground.position.y=-.55;ground.receiveShadow=true;scene.add(ground);
const water=new THREE.Mesh(new THREE.CircleGeometry(23,96),mat('#9fcfc9'));water.rotation.x=-Math.PI/2;water.position.y=-.7;scene.add(water);
// Hotel-centered stylized geography. Approximate geographic coordinates are used for relative placement; map links provide actual navigation.
const toPos=(lat,lon)=>({x:(lon-data.hotel.longitude)*90,z:(data.hotel.latitude-lat)*110});
const hotelPos={x:0,z:0},locations=[{...data.hotel,id:'hotel',name:data.hotel.name,english:data.hotel.english,description:'飯店主建築是整座導覽島的中心。點選可查看客房服務、餐廳、SPA與飯店服務設施。',kind:'hotel',x:0,z:0},...data.attractions.map(a=>({...a,...toPos(a.latitude,a.longitude)}))];
// Keep all twenty pins visually legible around the hotel; map URLs carry exact navigation.
const pickables=[],groups=[];
function box(parent,w,h,d,x,y,z,m){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function labelSprite(text,sub){const c=document.createElement('canvas');c.width=640;c.height=150;const q=c.getContext('2d');q.fillStyle='#fffaf0';q.strokeStyle='#45665a';q.lineWidth=5;q.beginPath();q.roundRect(8,8,624,134,24);q.fill();q.stroke();q.fillStyle='#203a42';q.font='bold 38px sans-serif';q.textAlign='center';q.fillText(text.slice(0,18),320,64);q.fillStyle='#638078';q.font='20px sans-serif';q.fillText(sub.slice(0,28),320,105);const tex=new THREE.CanvasTexture(c);const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));s.scale.set(3.5,.82,1);return s}
function buildAttraction(g,index){const colors=['#e8c878','#e59a7b','#a5c6a3','#8fb8c4','#c2a6c8'];const base=new THREE.Mesh(new THREE.CylinderGeometry(.78,.92,.3,10),sand);base.position.y=-.08;base.castShadow=true;base.receiveShadow=true;g.add(base);const top=new THREE.Mesh(new THREE.CylinderGeometry(.72,.72,.12,10),mat(colors[index%colors.length]));top.position.y=.12;g.add(top);const h=.6+(index%4)*.18;const b=box(g,.7,h,.65,0,.25+h/2,0,white);box(g,.74,.1,.7,0,.25+h,0,terracotta);for(let y=.35;y<h+.1;y+=.35)box(g,.12,.17,.025,-.2,y,.33,glass);const tree=new THREE.Mesh(new THREE.SphereGeometry(.28,10,10),grass);tree.position.set(.62,.5,.4);g.add(tree);}
function buildHotel(g){box(g,3.5,4.7,2.8,0,2.35,0,white);box(g,3.72,.18,3.02,0,4.78,0,gold);box(g,3.2,.16,2.6,0,3.5,0,terracotta);for(let y=.55;y<4.2;y+=.55){for(let x=-1.25;x<=1.25;x+=.62)box(g,.28,.32,.04,x,y,1.42,glass)}box(g,.85,1.2,.08,0,.62,1.45,terracotta);const sign=box(g,1.7,.34,.08,0,4.1,1.46,gold);}
locations.forEach((d,i)=>{const g=new THREE.Group();g.position.set(d.x,0,d.z);scene.add(g);groups.push(g);const isHotel=d.kind==='hotel';const base=new THREE.Mesh(new THREE.CylinderGeometry(isHotel?2.55:.9,isHotel?2.85:1.08,isHotel?.5:.28,12),sand);base.position.y=-.1;base.receiveShadow=true;g.add(base);const cap=new THREE.Mesh(new THREE.CylinderGeometry(isHotel?2.42:.82,isHotel?2.42:.82,.14,12),isHotel?gold:grass);cap.position.y=.22;g.add(cap);if(isHotel)buildHotel(g);else buildAttraction(g,i);const sp=labelSprite(d.name,isHotel?'HOTEL · MAIN CENTER':d.english);sp.position.y=isHotel?6:2.35;g.add(sp);const marker=new THREE.Mesh(new THREE.SphereGeometry(isHotel?.22:.13,14,14),mat(isHotel?'#e18442':'#d7a84e'));marker.position.set(isHotel?2.05:.58,.55,isHotel?1.1:.5);g.add(marker);const hit=new THREE.Mesh(new THREE.CylinderGeometry(isHotel?2.8:1.15,isHotel?2.8:1.15,5,12),new THREE.MeshBasicMaterial({transparent:true,opacity:0}));hit.position.y=1.8;hit.userData.location=d;g.add(hit);pickables.push(hit)});
// Human character made from simple low-poly meshes.
function person(color,staff=false){const g=new THREE.Group();const body= new THREE.Mesh(new THREE.CylinderGeometry(staff?.17:.14,staff?.18:.14,staff?.72:.54,10),mat(color));body.position.y=.58;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),mat('#f0c8a8'));head.position.y=1.03;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.165,10,8),mat('#463c35'));hair.position.set(0,1.12,-.015);g.add(hair);const leg1=box(g,.09,.34,.1,-.1,.17,0,mat('#344b59')),leg2=box(g,.09,.34,.1,.1,.17,0,mat('#344b59'));g.userData.legs=[leg1,leg2];if(staff){const badge=box(g,.13,.12,.035,0,.69,.15,mat('#f5d36e'));const ring=new THREE.Mesh(new THREE.TorusGeometry(.35,.035,8,28),mat('#2b83bb'));ring.rotation.x=Math.PI/2;ring.position.y=.05;g.add(ring)}return g}
const staff=person('#2777a8',true);staff.position.set(0,0,0);scene.add(staff);const staffLabel=labelSprite('飯店服務人員','STAFF · CURRENT POSITION');staffLabel.scale.set(2.7,.62,1);staffLabel.position.y=1.65;staff.add(staffLabel);
const npcs=[];for(let i=0;i<9;i++){const p=person(['#d98469','#719e83','#d7a84e','#8a9dc3'][i%4]);const loc=locations[1+(i*2)%data.attractions.length];p.position.set(loc.x+(Math.random()-.5)*1.8,0,loc.z+(Math.random()-.5)*1.8);scene.add(p);npcs.push({obj:p,target:null,speed:.5+Math.random()*.35,phase:Math.random()*6})}
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let currentTarget=null,staffTarget={x:0,z:0},moving=false;
function setText(el,txt){el.textContent=txt}
function addLink(container,label,url,alt=false){const a=document.createElement('a');a.textContent=label;a.href=url;a.target='_blank';a.rel='noopener noreferrer';if(alt)a.className='alt';container.append(a)}
function openPanel(d){const c=document.querySelector('#content');c.replaceChildren();const en=document.createElement('div');en.className='en';en.textContent=d.english||'HOTEL SERVICE';const h=document.createElement('h2');h.textContent=d.name;const p=document.createElement('p');p.textContent=d.description;const meta=document.createElement('div');meta.className='tag';meta.textContent=d.kind==='hotel'?'飯店中心':`觀光景點 ${d.number}／20`;const transit=document.createElement('div');transit.className='tag';transit.textContent=d.kind==='hotel'?`建議捷運：${d.metro}`:`建議捷運：${d.metro}`;const actions=document.createElement('div');actions.className='actions';c.append(en,h,meta,transit,p);if(d.kind==='hotel'){const sub=document.createElement('h3');sub.textContent='飯店服務設施';c.append(sub);data.facilities.forEach(f=>{const fh=document.createElement('h4');fh.textContent=f.name+' · '+f.english;const fp=document.createElement('p');fp.textContent=f.description;const fa=document.createElement('div');fa.className='actions';addLink(fa,'查看官方介紹 ↗',f.url);c.append(fh,fp,fa)})}else{const official=document.createElement('small');official.textContent='官方資訊備份：';c.append(official);addLink(actions,'官方景點／場館資訊 ↗',d.officialUrl);addLink(actions,'Google 地圖導航 ↗',d.mapUrl,true);c.append(actions);const note=document.createElement('small');note.textContent='交通線路為依景點位置整理的搭乘建議；轉乘、公車班次及步行路線請以台北捷運與地圖即時資訊為準。';c.append(note)}document.querySelector('#panel').classList.add('open')}
canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(pickables);if(hit.length)openPanel(hit[0].object.userData.location)});
document.querySelector('#close').onclick=()=>document.querySelector('#panel').classList.remove('open');
const select=document.querySelector('#destination');locations.forEach((d,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=d.name;select.append(o)});
function moveStaff(d){staffTarget={x:d.x,z:d.z};currentTarget=d;moving=true;setText(document.querySelector('#staff-status'),'目前位置：前往 '+d.name)}
document.querySelector('#go').onclick=()=>moveStaff(locations[Number(select.value)]);document.querySelector('#home').onclick=()=>{select.value='0';moveStaff(locations[0])};
function chooseNpcTarget(n){const d=data.attractions[Math.floor(Math.random()*data.attractions.length)];n.target={x:toPos(d.latitude,d.longitude).x+(Math.random()-.5)*.9,z:toPos(d.latitude,d.longitude).z+(Math.random()-.5)*.9}}
npcs.forEach(chooseNpcTarget);let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min((now-last)/1000,.05);last=now;controls.update();if(moving){const dx=staffTarget.x-staff.position.x,dz=staffTarget.z-staff.position.z,dist=Math.hypot(dx,dz);if(dist<.09){moving=false;setText(document.querySelector('#staff-status'),'目前位置：'+(currentTarget?.name||'飯店中心'))}else{staff.position.x+=dx/dist*2.25*dt;staff.position.z+=dz/dist*2.25*dt;staff.rotation.y=Math.atan2(dx,dz);const swing=Math.sin(now*.018)*.22;staff.userData.legs[0].rotation.x=swing;staff.userData.legs[1].rotation.x=-swing}}npcs.forEach((n,i)=>{if(!n.target||Math.hypot(n.target.x-n.obj.position.x,n.target.z-n.obj.position.z)<.15)chooseNpcTarget(n);const dx=n.target.x-n.obj.position.x,dz=n.target.z-n.obj.position.z,dist=Math.hypot(dx,dz);if(dist>.01){n.obj.position.x+=dx/dist*n.speed*dt;n.obj.position.z+=dz/dist*n.speed*dt;n.obj.rotation.y=Math.atan2(dx,dz);const swing=Math.sin(now*.009+n.phase)*.18;n.obj.userData.legs[0].rotation.x=swing;n.obj.userData.legs[1].rotation.x=-swing}});renderer.render(scene,camera)}requestAnimationFrame(animate);
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
})().catch(err=>{document.body.insertAdjacentText('beforeend','\n導覽資料載入失敗：'+err.message+'。請使用本機伺服器或 GitHub Pages 開啟，並確認 hotel-island-data.json 與 index.html 位於同一資料夾。')});
</script></body></html>
